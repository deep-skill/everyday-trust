name: Inspect deployment identity
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  identity:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Inspect only public identity claims
        shell: python
        run: |
          import os, json, urllib.request, base64
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization':'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          assert claims['repository'] == 'deep-skill/everyday-trust'
          assert claims['ref'] == 'refs/heads/main'
          print(json.dumps({k: claims.get(k) for k in ('iss','aud','sub','repository','repository_id','ref','environment')}))

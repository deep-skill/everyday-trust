<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="238px" preserveAspectRatio="none" style="width:572px;height:238px;background:#FFFFFF;" version="1.1" viewBox="0 0 572 238" width="572px" zoomAndPan="magnify"><title>Resultado inicial mientras contin&#250;a la revisi&#243;n</title><defs/><g><g class="title" data-source-line="35"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="334.7627" x="117.1187" y="28.5352">Resultado inicial mientras contin&#250;a la revisi&#243;n</text></g><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.0762" x="9" y="55.0898">Revisi&#243;n en curso</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="146" y1="57.6211" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="54.6211" y2="56.6211"/><line style="stroke:#000000;stroke-width:1;" x1="146" x2="146" y1="54.6211" y2="56.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="395.2383" x="9" y="73.2227">Advertencia disponible: el enlace no coincide con el dominio oficial.</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="562" y1="75.7539" y2="75.7539"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="72.7539" y2="74.7539"/><line style="stroke:#000000;stroke-width:1;" x1="562" x2="562" y1="72.7539" y2="74.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="387.2344" x="9" y="91.3555">Qu&#233; hacer ahora: confirma por un canal conocido antes de abrirlo.</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="530" y1="93.8867" y2="93.8867"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="90.8867" y2="92.8867"/><line style="stroke:#000000;stroke-width:1;" x1="530" x2="530" y1="90.8867" y2="92
<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SALT" height="172px" preserveAspectRatio="none" style="width:444px;height:172px;background:#FFFFFF;" version="1.1" viewBox="0 0 444 172" width="444px" zoomAndPan="magnify"><title>Beneficio antes del registro</title><defs/><g><g class="title" data-source-line="67"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="198.0645" x="121.4678" y="28.5352">Beneficio antes del registro</text></g><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.6758" x="9" y="55.0898">Guarda el resultado para volver a este caso</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="354" y1="57.6211" y2="57.6211"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="54.6211" y2="56.6211"/><line style="stroke:#000000;stroke-width:1;" x1="354" x2="354" y1="54.6211" y2="56.6211"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="293.4199" x="9" y="73.2227">Cuenta gratuita: historial privado y m&#225;s consultas.</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="418" y1="75.7539" y2="75.7539"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="72.7539" y2="74.7539"/><line style="stroke:#000000;stroke-width:1;" x1="418" x2="418" y1="72.7539" y2="74.7539"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="326.8945" x="9" y="91.3555">Conservaremos un resumen y las evidencias permitidas.</text><line style="stroke:#000000;stroke-width:1;" x1="7" x2="434" y1="93.8867" y2="93.8867"/><line style="stroke:#000000;stroke-width:1;" x1="7" x2="7" y1="90.8867" y2="92.8867"/><line style="stroke:#000000;stroke-width:1;" x1="434" x2="434" y1="90.8867" y2="92.8867"/><text fill="#000000" font-family="sans-serif" font-size="12